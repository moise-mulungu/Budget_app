databases:
  - name: budget-postgres

services:
  - type: web
    name: budget-app
    env: ruby
    plan: free
    runtime: ruby-3.2
    buildCommand: bundle install && bundle exec rake assets:precompile
    startCommand: bundle exec rake db:migrate && bundle exec puma -t 5:5 -p ${PORT:-3000}
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: budget-postgres
          property: connectionString
        scope: RUN_AND_BUILD_TIME
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: true
      - key: RAILS_MASTER_KEY
        scope: RUN_AND_BUILD_TIME
