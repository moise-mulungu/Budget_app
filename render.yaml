services:
  - type: web
    name: budget-app
    env: ruby
    plan: free
    buildCommand: bundle install && bundle exec rake assets:precompile && bundle exec rake db:migrate
    startCommand: bundle exec puma -t 5:5 -p ${PORT:-3000}
    envVars:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: true
      - key: RAILS_MASTER_KEY
        scope: RUN_AND_BUILD_TIME
    databases:
      - name: postgres
        plan: free
        version: 15
        initialDatabase: budget_app_production
